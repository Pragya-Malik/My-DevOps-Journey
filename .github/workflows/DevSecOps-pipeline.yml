name: End-to-End DevSecOps Pipeline

on:
  workflow_dispatch:

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  docker-lint:
    needs: [code-quality, secrets-scan, dependency-scan]
    uses: ./.github/workflows/docker-lint.yml

  build-push:
    needs: docker-lint
    uses: ./.github/workflows/build-push.yml
    secrets: inherit

  image-scan:
    needs: build-push
    uses: ./.github/workflows/image-scan.yml

  deploy-on-server:
    needs: image-scan
    uses: ./.github/workflows/deploy-on-server.yml
