name: Python lint

on:
    push:
        branches:
            - main

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4 
        
            - name: setup python
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"

            - name: install libraries and dependencies
              run: pip install -r requirments.txt
            
            - name: run linter
              run: flake8 app.py


              